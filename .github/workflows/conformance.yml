name: Conformance

# Somente manual (Actions > Conformance > Run workflow): a cota de CI esta esgotada e so roda com autorizacao do dono.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: conformance (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Corpora de terceiros em SHA fixo, fora do Git (target/conformance-cache/). AppleWin-Test nao
      # tem licenca: e baixado aqui e nunca redistribuido.
      - name: Third-party corpora (pinned SHAs)
        run: |
          tools/conformance/fetch-applewin-test.sh
          tools/conformance/fetch-65x02-tests.sh
          tools/conformance/fetch-z80-tests.sh
          tools/conformance/fetch-a2audit.sh

      # Codigo de saida de `run`: 0 tudo PASS, 1 FAIL real, 2 BLOCKED, 3 so divergencias conhecidas.
      # Os traces de referencia do oraculo (target/conformance-cache/reference-traces) so existem onde
      # o fork do audetto foi compilado; aqui esses casos terminam em BLOCKED e aparecem no resumo.
      # So FAIL real (1) ou erro de uso (64) reprovam o passo.
      - name: Conformance suite
        run: |
          set +e
          cargo run --release -p apple2-conformance --bin conformance -- run --all --report target/conformance-report
          code=$?
          set -e
          cat target/conformance-report/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "conformance run: codigo $code"
          case $code in 0|2|3) exit 0 ;; *) exit "$code" ;; esac

      # HU-1001: regressao de desempenho. Falha se a mediana de MHz (tempo de CPU da thread) piorar
      # alem da margem do baseline (max(15 %, 3 x CV)) ou se ciclos/quadro/audio deixarem de ser
      # identicos. O baseline vem de outra maquina: o --check compara entao MHz relativo ao cenario
      # `cpu`, com margem de pelo menos 40 % (veja crates/apple2-bench/src/report.rs). Rode so quando o workflow for liberado.
      - name: Performance regression (apple2-bench --check)
        run: cargo run --release -p apple2-bench -- --check tests/conformance/perf-baseline.json --no-latency --json target/perf/performance.json

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance
          path: target/perf
          if-no-files-found: warn

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: target/conformance-report
          if-no-files-found: warn
