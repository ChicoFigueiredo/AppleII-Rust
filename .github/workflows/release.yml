name: Release

# Tag `v*`  -> build all three platforms and publish a GitHub release.
# Manual run (workflow_dispatch) -> same build, artifacts only (dry run, no release is created).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: older glibc so the binary runs on more distros
          - { name: linux-x64, os: ubuntu-22.04, pkg: linux, ext: tar.gz }
          - { name: windows-x64, os: windows-latest, pkg: windows, ext: zip }
          - { name: macos-universal, os: macos-14, pkg: macos, ext: zip }
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="dev-${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build -p applewin --release
          echo "BINDIR=target/release" >> "$GITHUB_ENV"

      # macOS: build both architectures and merge them with lipo.
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build -p applewin --release --target aarch64-apple-darwin
          cargo build -p applewin --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/applewin \
            target/x86_64-apple-darwin/release/applewin \
            -output target/universal/applewin
          lipo -info target/universal/applewin
          echo "BINDIR=target/universal" >> "$GITHUB_ENV"

      # ROMs and symbols are embedded, so the bare executable must run: render 300 frames, no window.
      - name: Smoke test (headless)
        shell: bash
        run: |
          EXE="$BINDIR/applewin"; [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          "$EXE" --headless-frames 300 --dump-screen smoke.png
          test -s smoke.png

      - name: Package
        shell: bash
        run: packaging/package.sh "${{ matrix.pkg }}" "${{ steps.ver.outputs.version }}" "$BINDIR"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
