name: Release

# Publicacao: SOMENTE quando um pull request para `main` e MESCLADO (merged), o titulo contem
# `[release]` (sem distinguir maiusculas) e o autor do PR e o dono do repositorio.
# O workflow le a versao do Cargo.toml, cria a tag `v<versao>` no commit de merge e publica a release.
# Execucao manual (workflow_dispatch) = dry run: so compila e envia artefatos; nunca cria tag nem release.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Decide a versao e falha cedo se a tag ja existir. Em PRs que nao sao de release, o job inteiro e pulado.
  prepare:
    name: prepare
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.title, '[release]') &&
       github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.ver.outputs.sha }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Version
        id: ver
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # A versao do binario vem de [workspace.package] (crates/applewin usa version.workspace = true).
            V="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)".*/\1/p}' Cargo.toml | head -n1)"
            if [[ -z "$V" ]]; then echo "::error::Nao foi possivel ler a versao em Cargo.toml ([workspace.package])."; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
              echo "::error::A tag v$V ja existe. Aumente a versao em Cargo.toml no PR antes de publicar."
              exit 1
            fi
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: older glibc so the binary runs on more distros
          - { name: linux-x64, os: ubuntu-22.04, pkg: linux, ext: tar.gz }
          - { name: windows-x64, os: windows-latest, pkg: windows, ext: zip }
          - { name: macos-universal, os: macos-14, pkg: macos, ext: zip }
    steps:
      # Sempre o commit de merge (ou o do dispatch), nunca o head do PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build -p applewin --release
          echo "BINDIR=target/release" >> "$GITHUB_ENV"

      # macOS: build both architectures and merge them with lipo.
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build -p applewin --release --target aarch64-apple-darwin
          cargo build -p applewin --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/applewin \
            target/x86_64-apple-darwin/release/applewin \
            -output target/universal/applewin
          lipo -info target/universal/applewin
          echo "BINDIR=target/universal" >> "$GITHUB_ENV"

      # ROMs and symbols are embedded, so the bare executable must run: render 300 frames, no window.
      - name: Smoke test (headless)
        shell: bash
        run: |
          EXE="$BINDIR/applewin"; [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          "$EXE" --headless-frames 300 --dump-screen smoke.png
          test -s smoke.png

      - name: Package
        shell: bash
        run: packaging/package.sh "${{ matrix.pkg }}" "${{ needs.prepare.outputs.version }}" "$BINDIR"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Notas: titulo do PR (sem `[release]`) e corpo; titulo/corpo entram por env, nunca interpolados no shell.
      - name: Release notes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TITLE="$(printf '%s' "$PR_TITLE" | sed -E 's/\[release\]//Ig; s/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]{2,}/ /g')"
          { printf '## %s\n\n' "$TITLE"; printf '%s\n' "$PR_BODY"; } > notes.md

      # A acao cria a tag v<versao> no commit de merge (target_commitish) e publica a release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: v${{ needs.prepare.outputs.version }}
          body_path: notes.md
          files: artifacts/*
          generate_release_notes: true
