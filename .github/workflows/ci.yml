name: CI

# Somente manual (Actions > CI > Run workflow): a cota de CI é limitada e só roda com autorização do dono.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Informational for now: the workspace has no rustfmt.toml and is not rustfmt-formatted.
      - name: rustfmt (informational)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --release

      - name: Build applewin (release)
        run: cargo build -p applewin --release

      # Headless mode needs no display, GPU or audio device: runs the emulator core and video
      # renderer and writes a PNG. The release exe on Windows is a GUI-subsystem program.
      - name: Smoke test (headless)
        shell: bash
        run: |
          EXE=target/release/applewin; [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          "$EXE" --headless-frames 300 --dump-screen out.png
          test -s out.png
