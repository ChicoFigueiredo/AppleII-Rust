# Licencas de terceiros do pacote (cargo-about). Uso: tools/package/licenses.sh
accepted = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unlicense", "CC0-1.0", "0BSD", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016",
    "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0","LicenseRef-UFL-1.0", "GPL-2.0-or-later", "LGPL-2.1-or-later", "CDLA-Permissive-2.0",
]
# Dependencias de build/dev nao entram no binario distribuido
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
