id = "disk-prodos243-boot-apple2plus"
story = "HU-0301"
criterion = "O boot de ProDOS 2.4.3 no Apple ][+ com um Disk II no slot 6 executa a mesma sequência de instruções, ciclo a ciclo, que o AppleWin (tempo de nibble, motor, passo do braço, quarter tracks)"
model = "apple2plus"
notes = "Imagem livre versionada em assets/disks. Referência: 12000000 ciclos do oráculo AppleWin (fork audetto, memclear 0, RAM de power-on determinística), reduzidos a checkpoints a cada 2000 instruções com hash encadeado de todas as linhas. As leituras do barramento flutuante que divergem estão listadas como 'sync' (achado separado em docs/conformance/audit/disk-differential.md). Regerar: tools/conformance/oracle/run-audetto-oracle.sh + cargo run --release -p apple2-storage --example disk_follow -- --emit-ckpt."

