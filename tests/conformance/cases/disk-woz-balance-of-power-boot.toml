id = "disk-woz-balance-of-power-boot"
story = "HU-0301"
criterion = "O boot de WOZ Balance of Power (optimal bit timing 0x20) no Apple //e Enhanced com um Disk II no slot 6 executa a mesma sequência de instruções, ciclo a ciclo, que o AppleWin (tempo de nibble, motor, passo do braço, quarter tracks)"
model = "apple2e-enhanced"
cards = ["6:disk2"]
memclear = 0
notes = "Issues do AppleWin: n/a. Boot de imagem ou micro-programa de boot (tests/conformance/inputs/disk-micro, gerado por cargo run --release -p apple2-storage --example make_micro) comparado com o oráculo AppleWin (fork audetto, Apple //e Enhanced, memclear 0): sequência de instruções ciclo a ciclo e SHA-256 das imagens ao final. As imagens do corpus AppleWin-Test não são versionadas (sem elas o caso fica BLOCKED). Regerar: tools/conformance/disk/gen-disk-cases.sh disk-woz-balance-of-power-boot (ver docs/conformance/audit/disk-differential.md)."

[run]
cycles = 6000000

