id = "disk-woz-legacy-of-the-ancients-boot"
story = "HU-0301"
criterion = "O boot de WOZ Legacy of the Ancients side 1 no Apple //e Enhanced com um Disk II no slot 6 executa a mesma sequência de instruções, ciclo a ciclo, que o AppleWin (tempo de nibble, motor, passo do braço, quarter tracks)"
