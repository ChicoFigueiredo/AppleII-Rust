notes = "Imagem de terceiros do corpus AppleWin-Test (não versionada; fica em target/conformance-cache, ver tools/conformance/fetch-applewin-test.sh): sem ela o caso fica BLOCKED. Referência: 6000000 ciclos do oráculo AppleWin (fork audetto, memclear 0, RAM de power-on determinística), reduzidos a checkpoints a cada 2000 instruções com hash encadeado de todas as linhas. As leituras do barramento flutuante que divergem estão listadas como 'sync' (achado separado em docs/conformance/audit/disk-differential.md). Regerar: tools/conformance/oracle/run-audetto-oracle.sh + cargo run --release -p apple2-storage --example disk_follow -- --emit-ckpt."

