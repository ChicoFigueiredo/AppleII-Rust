id = "disk-woz-gruds-in-space-boot"
story = "HU-0301"
criterion = "O boot de WOZ Gruds in Space side A no Apple //e Enhanced com um Disk II no slot 6 executa a mesma sequência de instruções, ciclo a ciclo, que o AppleWin (tempo de nibble, motor, passo do braço, quarter tracks)"
