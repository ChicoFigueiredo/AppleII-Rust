[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/ChicoFigueiredo/AppleII-Rust"
authors = ["Chico Figueiredo", "Contributors of AppleWin (https://github.com/AppleWin/AppleWin)"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
