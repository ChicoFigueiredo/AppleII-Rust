[package]
name = "apple2-conformance"
description = "Conformance harness: reference traces, run manifests, declarative cases, JUnit reports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "apple2_conformance"
path = "src/lib.rs"

[[bin]]
name = "conformance"
path = "src/main.rs"

[dependencies]
apple2-core = { path = "../apple2-core" }
apple2-video = { path = "../apple2-video" }
apple2-savestate = { path = "../apple2-savestate" }
apple2-cpu = { path = "../apple2-cpu" }
apple2-audio = { path = "../apple2-audio" }
apple2-hostio = { path = "../apple2-hostio" }
apple2-storage = { path = "../apple2-storage" }
serde.workspace = true
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
