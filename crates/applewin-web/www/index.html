<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppleII-Rust web (protótipo)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #ddd; margin: 0; padding: 16px; }
  canvas { width: min(100%, 840px); image-rendering: pixelated; background: #000; display: block; }
  .barra { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  select, button, input { font: inherit; }
  #status { font-size: 0.9rem; color: #9a9; }
  #drop { border: 2px dashed #555; padding: 12px; border-radius: 6px; }
  #drop.sobre { border-color: #6c6; }
</style>
</head>
<body>
<h1>AppleII-Rust no navegador (protótipo)</h1>
<div class="barra">
  <label>Modelo
    <select id="modelo">
      <option value="apple2e-enhanced">Apple //e Enhanced</option>
      <option value="apple2e">Apple //e</option>
      <option value="apple2plus">Apple ][+</option>
      <option value="apple2">Apple ][</option>
    </select>
  </label>
  <label>ROM própria (opcional) <input type="file" id="rom"></label>
  <button id="ligar">Ligar</button>
  <button id="reset">Reset</button>
  <span id="status">desligado</span>
</div>
<canvas id="tela" width="560" height="384" tabindex="0"></canvas>
<div id="drop" class="barra">Arraste uma imagem de disco (.dsk, .do, .po, .nib, .woz) para cá, ou
  <input type="file" id="disco"></div>
<p>Clique na tela para dar foco ao teclado. Sem áudio neste protótipo.</p>

<script type="module">
// Antes de abrir esta página: wasm-bindgen --target web --out-dir www/pkg <arquivo .wasm>
// (veja docs/conformance/wasm-estudo.md) e sirva a pasta www/ por HTTP.
import init, { Apple2 } from './pkg/applewin_web.js';

const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');
const status = document.getElementById('status');
let maquina = null;
let ultimo = 0, quadros = 0, t0 = performance.now();

async function ligar() {
  const modelo = document.getElementById('modelo').value;
  const romArq = document.getElementById('rom').files[0];
  try {
    maquina = romArq
      ? Apple2.with_rom(modelo, new Uint8Array(await romArq.arrayBuffer()))
      : new Apple2(modelo);
  } catch (e) {
    status.textContent = 'erro: ' + e;
    return;
  }
  tela.width = maquina.width();
  tela.height = maquina.height();
  status.textContent = 'ligado';
}

function laco(agora) {
  requestAnimationFrame(laco);
  if (!maquina) return;
  // Um Quadro do Apple II (NTSC) dura 1/59,92 s; o rAF costuma chamar a 60 Hz.
  maquina.run_frame();
  const rgba = new Uint8ClampedArray(maquina.framebuffer());
  ctx.putImageData(new ImageData(rgba, maquina.width(), maquina.height()), 0, 0);
  quadros++;
  if (agora - t0 > 1000) {
    status.textContent = `ligado, ${quadros} quadros/s`;
    quadros = 0; t0 = agora;
  }
}

async function inserir(arq) {
  if (!maquina) return;
  try {
    maquina.insert_disk(0, arq.name, new Uint8Array(await arq.arrayBuffer()));
    maquina.reset();
  } catch (e) {
    status.textContent = 'disco recusado: ' + e;
  }
}

document.getElementById('ligar').onclick = ligar;
document.getElementById('reset').onclick = () => maquina && maquina.reset();
document.getElementById('disco').onchange = (e) => e.target.files[0] && inserir(e.target.files[0]);
const drop = document.getElementById('drop');
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('sobre'); };
drop.ondragleave = () => drop.classList.remove('sobre');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('sobre'); inserir(e.dataTransfer.files[0]); };

tela.addEventListener('click', () => tela.focus());
tela.addEventListener('keydown', (e) => {
  if (!maquina) return;
  let c = null;
  if (e.key.length === 1) c = e.key.charCodeAt(0);
  else if (e.key === 'Enter') c = 13;
  else if (e.key === 'Backspace' || e.key === 'ArrowLeft') c = 8;
  else if (e.key === 'ArrowRight') c = 21;
  else if (e.key === 'Escape') c = 27;
  if (c !== null && c < 128) { maquina.key(c); e.preventDefault(); }
});

await init();
status.textContent = 'pronto: escolha o modelo e clique em Ligar';
requestAnimationFrame(laco);
</script>
</body>
</html>
