[package]
name = "apple2-rust"
description = "AppleII-Rust desktop frontend (winit + wgpu + egui + cpal + gilrs)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "apple2_rust_shell"
path = "src/lib.rs"

[[bin]]
name = "apple2-rust"
path = "src/main.rs"

[features]
default = ["serialport"]
# Real host serial ports for the Super Serial Card.
serialport = ["apple2-hostio/serialport"]
# Raw Ethernet for the Uthernet cards (needs libpcap / Npcap).
pcap = ["apple2-hostio/pcap"]

[dependencies]
apple2-core = { path = "../apple2-core" }
apple2-audio = { path = "../apple2-audio" }
apple2-video = { path = "../apple2-video" }
apple2-cards = { path = "../apple2-cards" }
apple2-config ={ path = "../apple2-config" }
apple2-storage = { path = "../apple2-storage" }
apple2-debugger = { path = "../apple2-debugger" }
apple2-roms = { path = "../apple2-roms" }
apple2-hostio = { path = "../apple2-hostio" }
apple2-printer = { path = "../apple2-printer", default-features = false }
apple2-savestate = { path = "../apple2-savestate" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json = "1"
winit = "0.30"
wgpu = "24"
egui = "0.31"
egui-winit = "0.31"
egui-wgpu = { version = "0.31", features = ["winit"] }
cpal = "0.15"
gilrs = "0.11"
arboard = "3"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
# SVG toolbar icons (assets/ui/toolbar), rasterised once per scale. No text/fonts/raster images.
resvg = { version = "0.48", default-features = false }
ctrlc = { version = "3.5.2", features = ["termination"] }

[dev-dependencies]
apple2-cpu = { path = "../apple2-cpu" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Read by packaging/ scripts and release.yml (kept here as the single source of truth).
[package.metadata.packaging]
bundle-id = "io.github.chicofigueiredo.appleii-rust"
display-name = "AppleII-Rust"
categories = "Emulator;Game;"
disk-extensions = ["dsk", "do", "po", "nib", "woz", "2mg", "hdv", "aws.yaml"]
