[package]
name = "applewin"
description = "AppleII-Rust desktop frontend (winit + wgpu + egui + cpal + gilrs)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "applewin_shell"
path = "src/lib.rs"

[[bin]]
name = "applewin"
path = "src/main.rs"

[dependencies]
apple2-core = { path = "../apple2-core" }
apple2-audio = { path = "../apple2-audio" }
apple2-roms = { path = "../apple2-roms" }
serde.workspace = true
serde_json = "1"
winit = "0.30"
wgpu = "24"
egui = "0.31"
egui-winit = "0.31"
egui-wgpu = { version = "0.31", features = ["winit"] }
cpal = "0.15"
gilrs = "0.11"
arboard = "3"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
