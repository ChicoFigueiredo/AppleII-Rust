[package]
name = "apple2-rust-web"
description = "Protótipo opt-in do frontend web/WASM: Máquina, quadro, framebuffer RGBA, teclado e disco a partir de bytes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# cdylib gera o .wasm; rlib deixa os testes nativos e o resto do workspace usarem a mesma API.
crate-type = ["cdylib", "rlib"]

[dependencies]
apple2-core = { path = "../apple2-core" }
apple2-video = { path = "../apple2-video" }
apple2-storage = { path = "../apple2-storage" }

# Só entram no build para wasm32: o build desktop não ganha nenhuma dependência nova.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
