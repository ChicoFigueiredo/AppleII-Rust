[package]
name = "apple2-hostio"
description = "Host-connected Apple II cards: Super Serial Card, parallel printer, Uthernet I and II"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Real host serial ports for the Super Serial Card (AppleWin's COMx mode).
serialport = ["dep:serialport"]
# Raw Ethernet frames for the Uthernet cards through libpcap/Npcap (AppleWin's PCapBackend).
pcap = ["dep:pcap"]

[dependencies]
apple2-core = { path = "../apple2-core" }
apple2-roms = { path = "../apple2-roms" }
# Capture contract of the virtual printer (CaptureEvent, Transport); the crate has no I/O of its own.
apple2-printer = { path = "../apple2-printer", default-features = false }
serialport = { version = "4", default-features = false, optional = true }
pcap = { version = "2", optional = true }
# Portable list of network interfaces (Linux, macOS, Windows) when libpcap is not built in.
if-addrs = "0.15"

[dev-dependencies]
apple2-cpu = { path = "../apple2-cpu" }
# Acceptance tests drive the whole path: card -> capture -> spool -> LX-310 -> PDF (default features).
apple2-printer = { path = "../apple2-printer" }
apple2-cards = { path = "../apple2-cards" }
apple2-storage = { path = "../apple2-storage" }
tempfile = "3"
sha2 = "0.11"
